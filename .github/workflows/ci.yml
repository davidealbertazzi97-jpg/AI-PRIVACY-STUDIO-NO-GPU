name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install static analysis tools
        run: >-
          python -m pip install --disable-pip-version-check
          ruff==0.16.0 bandit==1.9.4
      - name: Check Python, shell, and JavaScript
        run: |
          ruff check .
          ruff format --check .
          bandit -q -c pyproject.toml -r app workers
          python -m compileall -q app tests workers
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n
          node --check static/app.js

  core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Install core and network guard
        run: |
          ./scripts/install-core.sh
          ./scripts/install-netguard.sh
      - name: Run isolated core smoke test
        run: .venv/bin/python tests/smoke_local.py --core-only
