name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install static analysis tools
        run: >-
          python -m pip install --disable-pip-version-check
          ruff==0.16.0 bandit==1.9.4
      - name: Check Python, shell, and JavaScript
        run: |
          ruff check .
          ruff format --check .
          bandit -q -c pyproject.toml -r app runtime_guard scripts workers
          python -m compileall -q app runtime_guard scripts tests workers
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n
          bash -n install.sh start.sh
          node --check static/app.js
          python - <<'PY'
          import re
          from pathlib import Path

          from scripts.start import guarded_environment

          html = Path("static/index.html").read_text(encoding="utf-8")
          javascript = Path("static/app.js").read_text(encoding="utf-8")
          assert 'data-language="it"' in html
          assert 'data-language="en"' in html
          translation_keys = set(
              re.findall(
                  r'data-i18n(?:-html|-aria|-placeholder)?="([^"]+)"',
                  html,
              )
          )
          missing = sorted(
              key
              for key in translation_keys
              if javascript.count(f'"{key}":') < 2
          )
          assert not missing, f"Traduzioni IT/EN mancanti: {missing}"

          environment = guarded_environment("x" * 48, 54321, 54322)
          assert environment["OLLAMA_HOST"] == "127.0.0.1:54322"
          assert environment["PRIVACY_STUDIO_OLLAMA_URL"] == \
              "http://127.0.0.1:54322"
          assert environment["OLLAMA_NO_CLOUD"] == "1"
          assert environment["HF_HUB_OFFLINE"] == "1"
          PY

  core-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv-python: .venv/bin/python
          - os: macos-14
            venv-python: .venv/bin/python
          - os: windows-latest
            venv-python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Validate platform plan and install core
        shell: bash
        run: |
          python scripts/bootstrap.py --core-only --skip-desktop --dry-run
          python scripts/bootstrap.py --core-only --skip-desktop
      - name: Run isolated core smoke test
        shell: bash
        run: '"${{ matrix.venv-python }}" tests/smoke_local.py --core-only'
      - name: Parse PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1",
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/start.ps1",
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
